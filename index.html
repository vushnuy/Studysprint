<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySprint</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:20px 14px 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:28px;font-weight:900}.brand span{color:#4f46e5}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 8px 24px #1018280b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:11px;font-size:15px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.gray{background:#f2f4f7}.danger{background:#fee4e2;color:#b42318}.hidden{display:none}.progress{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden}.bar{height:100%;background:#4f46e5;transition:.2s}.q{font-size:21px;font-weight:850;line-height:1.4;margin:20px 0}.opts{display:grid;gap:10px}.opt{padding:14px;text-align:left;border:2px solid #d0d5dd;background:#fff;border-radius:12px;cursor:pointer;font-size:16px}.opt.correct{background:#dcfae6;border-color:#12b76a;color:#05603a}.opt.wrong{background:#fee4e2;border-color:#f04438;color:#912018}.opt.lock{cursor:not-allowed}.nav{display:flex;justify-content:space-between;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;background:#f8fafc;border-radius:13px;text-align:center}.stat b{font-size:25px;display:block}.review{border:1px solid #e4e7ec;border-radius:13px;padding:13px;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:14px}.msg{margin-top:10px;font-size:14px}.ok{color:#067647}.err{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}.q{font-size:19px}.stats{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><div class="wrap">
<header><div class="brand">Study<span>Sprint</span> 📚</div><div><button class="btn gray" onclick="show('student')">Student</button> <button class="btn gray" onclick="show('admin')">Admin</button></div></header>
<section id="student" class="card"><h2>Start Practice</h2><div class="grid">
<div class="field"><label>Student name</label><input id="sname" placeholder="Your name"></div><div class="field"><label>Class</label><select id="sclass" onchange="loadSubjects()"></select></div>
<div class="field"><label>Subject</label><select id="ssub" onchange="loadChapters()"></select></div><div class="field"><label>Chapter / Topic</label><select id="schap"></select></div>
<div class="field"><label>Language</label><select id="slang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="bi">English + हिन्दी</option></select></div>
<div class="field"><label>Questions</label><select id="scount"><option>20</option><option>30</option></select></div></div>
<div class="nav"><button class="btn primary" onclick="start()">Start Test →</button></div><div id="smsg" class="msg"></div></section>
<section id="quiz" class="card hidden"><div class="muted" id="qn"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="q"></div><div id="opts" class="opts"></div><div id="explain" class="msg"></div><div class="nav"><button class="btn gray" onclick="prev()">← Previous</button><button id="next" class="btn primary" onclick="next()">Next →</button></div></section>
<section id="result" class="card hidden"><h2>Practice Complete 🎉</h2><div class="stats"><div class="stat"><b id="rscore">0</b>Score</div><div class="stat"><b id="rcorrect">0</b>Correct</div><div class="stat"><b id="racc">0%</b>Accuracy</div></div><div class="nav"><button class="btn primary" onclick="show('student')">New Test</button></div><h3>Answers & Explanations</h3><div id="reviews"></div></section>
<section id="admin" class="card hidden"><h2>Admin Panel</h2><div id="login"><div class="field"><label>Admin password</label><input id="apass" type="password"></div><div class="nav"><button class="btn primary" onclick="login()">Login</button></div><p class="muted">Set ADMIN_PASSWORD on Render. Never use admin123 in production.</p></div>
<div id="dash" class="hidden"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="adminTab('questions')">Questions</button><button class="btn gray" onclick="adminTab('progress')">Student Progress</button><button class="btn danger" onclick="logout()">Logout</button></div>
<div id="questionsTab"><h3>Add Question</h3><div class="grid">
<div class="field"><label>Class</label><input id="qc" value="10"></div><div class="field"><label>Subject</label><input id="qs" placeholder="Science"></div><div class="field"><label>Chapter</label><input id="qh" placeholder="Electricity"></div><div class="field"><label>Language</label><select id="ql"><option value="en">English</option><option value="hi">Hindi</option></select></div>
<div class="field" style="grid-column:1/-1"><label>Question</label><input id="qq"></div><div class="field"><label>A</label><input id="qa"></div><div class="field"><label>B</label><input id="qb"></div><div class="field"><label>C</label><input id="qcc"></div><div class="field"><label>D</label><input id="qd"></div>
<div class="field"><label>Correct option</label><select id="qans"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Short explanation</label><input id="qe"></div></div>
<div class="nav"><button class="btn primary" onclick="addQ()">Save Question</button></div><div id="amsg" class="msg"></div><h3>Existing Questions</h3><div id="qlist"></div></div>
<div id="progressTab" class="hidden"><div id="plist"></div></div></div></section></div>
<script>
let quiz=[],ans=[],pos=0,cfg={};const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function show(id){['student','quiz','result','admin'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='admin')adminInit()}
async function loadClasses(){let d=await api('/api/meta');$('sclass').innerHTML=d.classes.map(x=>`<option>${x}</option>`).join('');loadSubjects()}
async function loadSubjects(){let d=await api('/api/meta'),c=$('sclass').value;$('ssub').innerHTML=d.subjects.filter(x=>x.class_name===c).map(x=>`<option>${x.subject}</option>`).join('');loadChapters()}
async function loadChapters(){let d=await api('/api/meta'),c=$('sclass').value,s=$('ssub').value;$('schap').innerHTML=d.chapters.filter(x=>x.class_name===c&&x.subject===s).map(x=>`<option>${x.chapter}</option>`).join('')}
async function start(){try{let d=await api('/api/quiz',{method:'POST',body:JSON.stringify({student:$('sname').value,class_name:$('sclass').value,subject:$('ssub').value,chapter:$('schap').value,language:$('slang').value,count:+$('scount').value})});quiz=d.questions;ans=Array(quiz.length).fill(null);pos=0;cfg=d.config;show('quiz');render()}catch(e){$('smsg').textContent=e.message;$('smsg').className='msg err'}}
function render(){let q=quiz[pos];$('qn').textContent=`Question ${pos+1} of ${quiz.length}`;$('bar').style.width=((pos+1)/quiz.length*100)+'%';$('question').textContent=q.question;let box=$('opts');box.innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;if(ans[pos]!==null){b.classList.add('lock');if(i===q.answer)b.classList.add('correct');if(i===ans[pos]&&ans[pos]!==q.answer)b.classList.add('wrong');b.disabled=true}b.onclick=()=>choose(i);box.appendChild(b)});$('explain').textContent=ans[pos]===null?'':q.explanation;$('explain').className='msg '+(ans[pos]===q.answer?'ok':'err');$('next').textContent=pos===quiz.length-1?'Finish ✓':'Next →'}
function choose(i){if(ans[pos]!==null)return;ans[pos]=i;render()}function next(){if(ans[pos]===null){alert('Please select an answer.');return}if(pos<quiz.length-1){pos++;render()}else finish()}function prev(){if(pos>0){pos--;render()}}
async function finish(){let score=quiz.reduce((n,q,i)=>n+(ans[i]===q.answer?1:0),0);await api('/api/attempt',{method:'POST',body:JSON.stringify({student:$('sname').value,class_name:cfg.class_name,subject:cfg.subject,chapter:cfg.chapter,score,total:quiz.length,accuracy:Math.round(score/quiz.length*100)})});$('rscore').textContent=score+'/'+quiz.length;$('rcorrect').textContent=score;$('racc').textContent=Math.round(score/quiz.length*100)+'%';$('reviews').innerHTML=quiz.map((q,i)=>`<div class="review"><b>${i+1}. ${q.question}</b><br>Your answer: ${q.options[ans[i]]}<br><b>Correct: ${q.options[q.answer]}</b><div class="muted">${q.explanation}</div></div>`).join('');show('result')}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('apass').value})});adminInit()}catch(e){$('amsg').textContent=e.message;$('amsg').className='msg err'}}
async function adminInit(){let d=await api('/api/admin/status');$('login').classList.toggle('hidden',d.logged);$('dash').classList.toggle('hidden',!d.logged);if(d.logged)loadQuestions()}
async function logout(){await api('/api/admin/logout',{method:'POST'});adminInit()}
async function addQ(){try{await api('/api/admin/questions',{method:'POST',body:JSON.stringify({class_name:$('qc').value,subject:$('qs').value,chapter:$('qh').value,language:$('ql').value,question:$('qq').value,a:$('qa').value,b:$('qb').value,c:$('qcc').value,d:$('qd').value,answer:+$('qans').value,explanation:$('qe').value})});$('amsg').textContent='Question saved.';$('amsg').className='msg ok';loadQuestions();loadClasses()}catch(e){$('amsg').textContent=e.message;$('amsg').className='msg err'}}
async function loadQuestions(){let d=await api('/api/admin/questions');$('qlist').innerHTML='<table class="table"><tr><th>Class</th><th>Subject</th><th>Chapter</th><th>Question</th><th></th></tr>'+d.questions.map(q=>`<tr><td>${q.class_name}</td><td>${q.subject}</td><td>${q.chapter}</td><td>${q.question}</td><td><button class="btn danger" onclick="delQ(${q.id})">Delete</button></td></tr>`).join('')+'</table>'}
async function delQ(id){if(!confirm('Delete this question?'))return;await api('/api/admin/questions/'+id,{method:'DELETE'});loadQuestions();loadClasses()}
async function adminTab(t){$('questionsTab').classList.toggle('hidden',t!=='questions');$('progressTab').classList.toggle('hidden',t!=='progress');if(t==='progress'){let d=await api('/api/admin/progress');$('plist').innerHTML='<table class="table"><tr><th>Student</th><th>Class</th><th>Subject</th><th>Chapter</th><th>Score</th><th>Accuracy</th></tr>'+d.attempts.map(x=>`<tr><td>${x.student||'-'}</td><td>${x.class_name}</td><td>${x.subject}</td><td>${x.chapter}</td><td>${x.score}/${x.total}</td><td>${x.accuracy}%</td></tr>`).join('')+'</table>'}}
loadClasses();
</script></body></html>
